
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bulls Paradise</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #080a10;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 15px;
    color: white;
}

.container {
    width: 100%;
    max-width: 620px;
    padding: 65px 35px;
    text-align: center;
    background: linear-gradient(145deg, #171a24, #10131c);
    border: 1px solid rgba(218,190,75,0.3);
    border-radius: 45px;
    box-shadow: 0 0 35px rgba(0,0,0,0.5);
}

/* HERO IMAGE */

.hero-image {
    width: 220px;
    height: 220px;
    margin: 10px auto 40px;
    border-radius: 50%;
    border: 6px solid #d9b83e;
    background: radial-gradient(circle, #171a20, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 0 45px rgba(218,190,75,0.25);
    overflow: hidden;
}

.hero-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
}

/* BRAND */

h1 {
    font-size: 43px;
    color: #e6c64e;
    font-weight: 800;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 22px;
    color: #a4a6b1;
    letter-spacing: 1.5px;
    margin-bottom: 25px;
}

.description {
    font-size: 23px;
    color: #e0e0e5;
    line-height: 1.6;
    margin: 20px 0 45px;
}

.dot {
    color: #e6c64e;
    padding: 0 8px;
}

/* JOIN SECTION */

.join-text {
    font-size: 22px;
    color: #a5a7b1;
    margin-bottom: 28px;
}

/* ONLY BLUE GLOW BUTTON */

.join-btn {
    width: 100%;
    max-width: 450px;
    margin: auto;
    padding: 25px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 18px;

    background: linear-gradient(135deg, #8be0ff, #38bdf8);
    color: #06121b;
    text-decoration: none;
    font-size: 27px;
    font-weight: bold;
    border-radius: 24px;

    box-shadow:
        0 0 15px rgba(56,189,248,0.5),
        0 0 35px rgba(56,189,248,0.3);

    transition: 0.3s ease;
}

.join-btn:hover {
    transform: translateY(-4px);
    box-shadow:
        0 0 20px rgba(56,189,248,0.8),
        0 0 55px rgba(56,189,248,0.6);
}

.telegram-icon {
    font-size: 30px;
}

/* COUNTDOWN */

.countdown {
    margin: 35px 0;
    font-size: 21px;
    color: #a4a6b1;
}

#timer {
    color: #e6c64e;
    font-weight: bold;
}

/* FEATURES */

.features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 14px;
    margin: 40px 0;
}

.feature {
    background: #222630;
    border: 1px solid #343945;
    color: #c4c6cf;
    padding: 13px 22px;
    border-radius: 30px;
    font-size: 17px;
}

/* FOOTER */

hr {
    border: none;
    border-top: 1px solid #30343d;
    margin: 50px 0 35px;
}

.footer {
    color: #858995;
    font-size: 17px;
    line-height: 1.7;
}

.footer p {
    margin-bottom: 12px;
}

/* MOBILE */

@media(max-width: 500px) {
    .container {
        padding: 50px 22px;
        border-radius: 35px;
    }

    .hero-image {
        width: 180px;
        height: 180px;
        margin-bottom: 40px;
    }

    h1 {
        font-size: 32px;
    }

    .subtitle {
        font-size: 16px;
    }

    .description {
        font-size: 19px;
    }

    .join-btn {
        font-size: 22px;
        padding: 22px 10px;
    }

    .feature {
        font-size: 14px;
        padding: 11px 17px;
    }

    .footer {
        font-size: 14px;
    }
}
</style>

<body>

<div class="container">

    <!-- HERO IMAGE -->
    <div class="hero-image">
        <img src="bulls-logo.png" alt="The Bulls Paradise Logo">
    </div>

    <!-- BRAND NAME -->
    <h1>Trade with SUDARSHAN</h1>

    <div class="subtitle">
        OFFICIAL TELEGRAM CHANNEL
    </div>

    <!-- DESCRIPTION -->
    <div class="description">
        Market Analysis <span class="dot">◆</span> Trading
        <br>
        Education
    </div>

    <div class="join-text">
        Tap below to join
    </div>

    <!-- TELEGRAM BUTTON -->
    <a href="https://t.me/+cG_u_6iyVdBjNDc1"
       class="join-btn"
       id="joinButton">

       <span class="telegram-icon">➤</span>
       Join Telegram

    </a>

    <!-- COUNTDOWN -->
    <div class="countdown">
        Auto-joining in <span id="timer">55s</span>
    </div>

    <!-- FEATURES -->
    <div class="features">
        <div class="feature">Click to join</div>
        <div class="feature">No spam</div>
        <div class="feature">Unsubscribe anytime</div>
    </div>

    <hr>

    <!-- FOOTER -->
    <div class="footer">
        <p>© 2026 The Bulls Paradise · Powered by Telegram</p>
        <p>Trading involves risk. Educational content only.</p>
    </div>

</div>

<script>
let seconds = 55;

const timer = document.getElementById("timer");
const joinButton = document.getElementById("joinButton");

const countdown = setInterval(() => {

    seconds--;
    timer.textContent = seconds + "s";

    if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = joinButton.href;
    }

}, 1000);
</script>

</body>
</html>
